<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Football Career Life</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Career Life">
<meta name="theme-color" content="#0b1020">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--card:#141b2e;--card2:#1b2440;--line:#26304f;--txt:#eef2ff;--mut:#8b95b5;--acc:#c6ff3d;--acc2:#3dd6ff;--red:#ff5a6a;--gold:#ffcc4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.scroll{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 92px)}
.mut{color:var(--mut)}.small{font-size:12.5px}.center{text-align:center}.acc{color:var(--acc)}.grow{flex:1;min-width:0}
h1,h2,h3{margin:.2em 0 .5em}h3{font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700;margin:6px 0 8px}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:8px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:800 15px Inter,system-ui;background:var(--acc);color:#0b1020;margin-top:10px;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}.btn.red{background:var(--red);color:#fff}.btn.xl{font-size:22px;padding:18px}
.btn:disabled,.opt:disabled{opacity:.4}
.row .btn{margin-top:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px 14px;font:600 15px Inter,system-ui;cursor:pointer}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.opt b{font-weight:700}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 12px;font:600 13px Inter,system-ui;cursor:pointer;display:inline-block;margin:3px 2px}
.chip.on{background:var(--acc);color:#0b1020;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;margin:8px 0}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.on{border-color:var(--acc)}
input,select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px;font:600 16px Inter,system-ui;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:900;flex:none;vertical-align:middle;letter-spacing:-.02em}
.bar{height:8px;background:#0b1020;border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:99px}
.start{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px;text-align:center}
.cover{width:220px;height:220px;border-radius:48px;margin:0 auto 10px;box-shadow:0 20px 60px rgba(198,255,61,.25)}.start h1{font-size:40px;line-height:1;font-weight:900}.start h1 span{color:var(--acc)}.logo{font-size:70px}
.steps{display:flex;gap:4px;margin-bottom:14px}.steps span{flex:1;font-size:10.5px;text-align:center;padding:6px 2px;border-radius:8px;background:var(--card);color:var(--mut)}.steps span.on{background:var(--acc);color:#0b1020;font-weight:800}.steps span.done{color:var(--acc)}
.avbig{display:flex;justify-content:center;margin:6px 0 14px}.avbig svg{border-radius:50%;box-shadow:0 0 0 4px var(--card2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.rolecard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 8px;color:var(--txt);font:700 14px Inter;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer}.rolecard b{font-size:30px}.rolecard.on{border-color:var(--acc);background:#1c2a1a}
.statrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.statrow span{flex:1}.statrow b{width:34px;text-align:center;font-size:18px}
.pm{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:22px;cursor:pointer}
.big{font-size:44px;font-weight:900;color:var(--acc);line-height:1.1}
.navrow .btn{flex:1}
.lino{display:flex;gap:12px;align-items:flex-start}.linoav{font-size:40px;background:var(--card2);border-radius:50%;width:58px;height:58px;display:flex;align-items:center;justify-content:center;flex:none}.lino p{margin:6px 0 0;color:#cdd5f0;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}.kv span{color:var(--mut)}.kv b{text-align:right}
.offer .lg,.lg{font-size:17px}.tag{background:var(--acc2);color:#0b1020;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px}
.tagbig{background:var(--acc);color:#0b1020;font-weight:800;padding:8px 12px;border-radius:12px;display:inline-block}
.hero{display:flex;gap:12px;align-items:center;margin-bottom:10px}.hero .av svg{border-radius:50%;box-shadow:0 0 0 3px var(--acc)}.nm{font-size:19px;font-weight:900;line-height:1.1;margin-bottom:3px}
.ovr{background:var(--acc);color:#0b1020;border-radius:14px;padding:6px 10px;text-align:center;line-height:1}.ovr b{font-size:26px;font-weight:900;display:block}.ovr span{font-size:10px;font-weight:800}
.money{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:12px}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:12px;font-weight:700}
.warn{background:#3a1820;border:1px solid var(--red);color:#ffc2c8;padding:10px 12px;border-radius:14px;margin-bottom:12px;font-size:14px}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:10px 0}.match>div{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:14px}
.vs{font-weight:900;color:var(--mut);font-size:13px}.score{font-size:30px;font-weight:900}
.days{display:flex;gap:6px;align-items:center}.days i{width:14px;height:14px;border-radius:50%;background:var(--card2);border:1px solid var(--line)}.days i.on{background:var(--acc);border-color:var(--acc)}.days span{margin-left:6px}
.qa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}.qa button{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:14px;padding:12px 4px;font:700 13px Inter;cursor:pointer}
.newsi{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.newsi p{margin:0;font-size:14px;line-height:1.35}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:rgba(14,20,38,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:20}
.nav button{flex:1;background:none;border:0;color:var(--mut);font:700 10.5px Inter;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}.nav button span{font-size:21px;filter:grayscale(1);opacity:.7}.nav button.on{color:var(--acc)}.nav button.on span{filter:none;opacity:1}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;max-height:86vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(env(safe-area-inset-bottom) + 20px);z-index:31;animation:up .22s ease}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:50%;transform:translate(-50%,-140%);width:calc(100% - 28px);max-width:490px;background:var(--card2);border:1px solid var(--acc);color:var(--txt);border-radius:14px;padding:12px 14px;z-index:50;opacity:0;transition:transform .25s,opacity .25s;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}#toast.on{transform:translate(-50%,0);opacity:1}
.map{width:100%;height:auto;margin-top:10px;display:block}.pin{cursor:pointer}.pin .pl{font-size:10px;font-weight:700;fill:#cdd5f0}.pin.lock{opacity:.55}
.girl{display:flex;gap:12px;align-items:center;background:var(--card2);border-radius:14px;padding:10px 12px;margin-bottom:8px}.girl span{font-size:34px}.girl p{margin:2px 0 0}
.q{font-size:16px;font-weight:700;margin:12px 0 10px}.flog{background:#0f1630;border-left:3px solid var(--acc2);padding:8px 10px;border-radius:8px;font-size:14px}
.boom{font-size:30px;font-weight:900;text-align:center;padding:26px 0 10px;color:#ff7a59;text-shadow:0 0 20px rgba(255,90,90,.5);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:11.5px;color:var(--mut);margin-bottom:6px}.stats4 b{display:block;font-size:22px;color:var(--txt);font-weight:900}
.tb{width:100%;border-collapse:collapse;font-size:13px}.tb th{color:var(--mut);font-weight:700;font-size:11px;padding:6px 4px;text-align:center}.tb td{padding:7px 4px;text-align:center;border-top:1px solid var(--line)}.tb .l{text-align:left}
.tb tr.me td{background:rgba(198,255,61,.12);font-weight:800}.tb tr.up td:first-child{box-shadow:inset 3px 0 var(--acc)}.tb tr.down td:first-child{box-shadow:inset 3px 0 var(--red)}
.seg{display:flex;gap:4px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.seg button{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:9px 13px;font:700 13px Inter;cursor:pointer}.seg button.on{background:var(--acc);color:#0b1020;border-color:var(--acc)}
.attr{display:grid;grid-template-columns:110px 34px 1fr 38px;gap:8px;align-items:center;font-size:14px}.attr em{font-style:normal;color:var(--mut);font-size:11px;text-align:right}
.final{margin:6px 0}
.mview{min-height:100vh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 14px)}
.mhead{background:linear-gradient(180deg,#16224a,#101833);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center}
.board{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:8px}.board>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.board .mid{display:flex;flex-direction:column}.board .mid span{font-size:38px;font-weight:900;letter-spacing:.04em}.board .mid em{font-style:normal;color:var(--acc);font-weight:800}
.chance{background:var(--card);border:1px solid var(--acc);border-radius:20px;padding:14px;margin-top:12px;animation:fadein .2s}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}}
.cmin{color:var(--acc);font-weight:900;letter-spacing:.06em;font-size:13px;margin-bottom:8px;text-align:center}.ctxt{font-size:16px;font-weight:700;line-height:1.35}
.pitch{width:100%;border-radius:10px;display:block}
.tbar{position:relative;height:46px;background:#0b1020;border-radius:14px;margin:16px 0;overflow:hidden;border:1px solid var(--line)}
.tbar .zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,rgba(198,255,61,.35),var(--acc),rgba(198,255,61,.35))}
.tbar .cur{position:absolute;top:-2px;bottom:-2px;width:5px;margin-left:-2px;background:#fff;border-radius:3px;box-shadow:0 0 10px #fff}
.res{font-size:19px;font-weight:800;text-align:center;padding:16px 4px;line-height:1.4}.res.ok{color:var(--acc)}.res.ko{color:var(--red)}.res.mid{color:var(--gold)}
.voto{width:96px;height:96px;border-radius:50%;border:5px solid;margin:10px auto 14px;display:flex;flex-direction:column;align-items:center;justify-content:center}.voto b{font-size:32px;font-weight:900}.voto span{font-size:11px;color:var(--mut)}
.feed{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 12px;flex:1;max-height:42vh;overflow:auto}.feed p{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:30px;text-align:center;gap:40px}.gate p{font-size:26px;font-weight:900;line-height:1.3;margin:0}.gatebtn{width:100%;max-width:340px;padding:34px 20px;border:0;border-radius:24px;background:#e01e2f;color:#fff;font:900 30px Inter,system-ui;box-shadow:0 10px 40px rgba(224,30,47,.5);cursor:pointer;text-transform:uppercase}.gatebtn:active{transform:scale(.97)}
.tri.quad{grid-template-columns:1fr 1fr}.qa.q4{grid-template-columns:1fr 1fr 1fr 1fr}.qa.q4 button{font-size:12px}
.ighead{display:flex;gap:14px;align-items:center;margin-bottom:6px}.igav svg{border-radius:50%;box-shadow:0 0 0 3px #e1306c,0 0 0 5px #fcaf45}
.igstats{display:flex;gap:16px;margin-top:6px;font-size:12px;color:var(--mut)}.igstats b{display:block;color:var(--txt);font-size:17px}
.iggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.igpost{aspect-ratio:1;border:0;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;cursor:pointer;font:700 11px Inter}.igpost span{font-size:30px}.igpost em{font-style:normal;opacity:.9}
.igpost.big{width:100%;border-radius:14px;margin-bottom:10px}.igpost.big span{font-size:90px}
.ig-campo{background:linear-gradient(135deg,#1c6b3a,#0f3d22)}.ig-allenamento{background:linear-gradient(135deg,#3a4466,#1b2440)}.ig-serata{background:linear-gradient(135deg,#7b2ff7,#f107a3)}.ig-lusso{background:linear-gradient(135deg,#c9a227,#6b4f0d)}.ig-coppia{background:linear-gradient(135deg,#ff5a8a,#ff9a5a)}
.dm{display:flex;gap:10px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;color:var(--txt);text-align:left;font:600 14px Inter;cursor:pointer}.dm p{margin:2px 0 0;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dm.new{border-color:#e1306c}.dmav{font-size:26px}.dot{width:10px;height:10px;border-radius:50%;background:#e1306c;flex:none}
.bub{padding:10px 14px;border-radius:18px;margin:8px 0;max-width:85%;font-size:15px}.bub.them{background:var(--card2)}.bub.me{background:#3a5bff;margin-left:auto}
.thread{max-height:46vh;overflow:auto}
</style>
</head>

function buildWorld() {

  for (const cn in CLUBS) {
    const c = CLUBS[cn];
    c.tiers.forEach((tier, t) => {
      tier.groups.forEach((names, g) => {
        const key = cn + '|' + t + '|' + g; G[key] = [];
        const hi = c.hi - 12 * t, lo = c.lo - 10 * t;
        names.forEach((n, i) => {
          const s = Math.round(hi - (hi - lo) * (i / Math.max(1, names.length - 1)) + rnd(-2, 2));

}

    if (called && !S.p.firstCall) { S.p.firstCall = true; news('PRIMA CONVOCAZIONE in nazionale ' + nat.f + ' ' + nat.n + '!', '🎉'); S.p.fame = clamp(S.p.fame + 4, 0, 100); }

let CLK = null, ANIM = null;
function teamTag(t, size) { return t.f ? badge('', size, t.f) : badge(t.n, size); }
function openMatch(ctx, dec) {
  const p = S.p; const start = dec === 'start'; const o = ovr();
  const sUs = ctx.us.s + (o - ctx.us.s) * .15;
  const d = (sUs - ctx.them.s) / 15; const ha = ctx.neutral ? 1 : (ctx.home ? 1.12 : .92), ht = ctx.neutral ? 1 : (ctx.home ? .9 : 1.08);
  const sc = start ? .72 : .88;
  const lu = clamp(1.3 * Math.exp(d) * ha, .2, 4) * sc, lt = clamp(1.3 * Math.exp(-d) * ht, .2, 4) * sc;
  const ev = []; for (let i = poisson(lu); i > 0; i--) ev.push({ m: ri(1, 90), t: 'gU' }); for (let i = poisson(lt); i > 0; i--) ev.push({ m: ri(1, 90), t: 'gT' });
  const enter = start ? 0 : ri(55, 72);
  const n = start ? 4 + ri(-1, 1) : ri(1, 2);
  buildChances(p.ruolo, n).forEach(c => ev.push({ m: ri(enter + 3, 89), t: 'ch', c }));
  ev.sort((a, b) => a.m - b.m);
  UI.m = { ctx, dec, ev, ei: 0, min: 0, gu: 0, gt: 0, feed: [], st: { goals: 0, assists: 0, saves: 0, stops: 0, fails: 0, err: 0, card: 0, used: [] }, state: 'run', enter, sUs, sThem: ctx.them.s, red: false };
  UI.m.feed.push(start ? '🟢 Sei titolare! Il mister ti ha dato fiducia.' : '🪑 Parti dalla panchina, tieniti pronto.');
  if (UI.simMode) { UI.m.headless = true; return simRun(); }
  renderMatch(); runClock();
}
function runClock() {
  clearInterval(CLK);
  CLK = setInterval(() => {
    const m = UI.m; if (!m || m.state !== 'run') { clearInterval(CLK); return; }
    m.min++;
    if (m.min === m.enter && m.enter > 0 && !m.red) m.feed.unshift(`${m.min}' 🔁 Entri in campo!`);
    if (m.min === 45) m.feed.unshift("45' ⏸️ Fine primo tempo.");
    while (m.ei < m.ev.length && m.ev[m.ei].m <= m.min) {
      const e = m.ev[m.ei++];
      if (e.t === 'gU') { m.gu++; m.feed.unshift(`${e.m}' ⚽ GOL ${esc(m.ctx.us.n)}! Segna un compagno.`); }
      else if (e.t === 'gT') { m.gt++; m.feed.unshift(`${e.m}' 😖 Gol ${esc(m.ctx.them.n)}.`); }
      else if (e.t === 'ch' && !m.red) { m.state = 'chance'; m.cur = e.c; m.curMin = e.m; clearInterval(CLK); renderMatch(); return; }
    }
    if (m.min >= 90) { clearInterval(CLK); m.feed.unshift("90' 🏁 Fischio finale."); if (m.ctx.ko && m.gu === m.gt) { m.state = 'pens'; renderMatch(); } else endMatch(); return; }
    updClock();
  }, 55);
}
function updClock() { const m = UI.m; const a = $('#mclock'); if (a) a.textContent = m.min + "'"; const s = $('#mscore'); if (s) s.textContent = (m.ctx.home ? m.gu : m.gt) + ' - ' + (m.ctx.home ? m.gt : m.gu); const f = $('#mfeed'); if (f) f.innerHTML = m.feed.slice(0, 12).map(x => `<p>${x}</p>`).join(''); }
function effStat(k) { const p = S.p; return p.st[k] + (styleStats().includes(k) ? 3 : 0) + (p.en - 60) / 8 + (p.mo - 50) / 10 + (p.fo - 50) / 10 - Math.max(0, (p.stx || 0) - 55) / 5 + (p.st.men - 50) / 25; }
function renderMatch() {
  const m = UI.m, c = m.ctx; if (m.headless) return; const H = c.home ? c.us : c.them, A = c.home ? c.them : c.us;
  let panel = '';
  if (m.state === 'chance') {
    panel = `<div class="chance"><div class="cmin">${m.curMin}' · TOCCA A TE</div>${pitch(m.cur)}<p class="ctxt">${m.cur[0]}</p><div class="col">${m.cur[1].map((o, i) => `<button class="opt" onclick="chooseOpt(${i})"><b>${o[0]}</b><span class="mut small">${SNAME[o[1]]} ${S.p.st[o[1]]}${o[2] >= 5 ? ' · difficile' : o[2] <= -3 ? ' · sicura' : ''}</span></button>`).join('')}</div></div>`;
  } else if (m.state === 'timing') {
    panel = `<div class="chance"><div class="cmin">${m.opt[0].toUpperCase()}</div><p class="mut small center">Ferma il cursore nella zona verde!</p><div class="tbar"><i class="zone" style="left:${m.zc - m.zw / 2}%;width:${m.zw}%"></i><i class="cur" id="tcur"></i></div><button class="btn xl" onclick="tapTiming()">VAI!</button></div>`;
  } else if (m.state === 'result') {
    panel = `<div class="chance"><div class="res ${m.rk}">${m.rtxt}</div><button class="btn" onclick="resumeMatch()">Continua</button></div>`;
  } else if (m.state === 'pens') {
    const gk = S.p.ruolo === 'POR';
    panel = `<div class="chance"><div class="cmin">CALCI DI RIGORE</div><p class="ctxt">${gk ? 'Tocca a te parare l’ultimo rigore decisivo. Dove ti tuffi?' : 'Tiri il rigore decisivo. Dove calci?'}</p><div class="row">${['Sinistra', 'Centro', 'Destra'].map((d, i) => `<button class="btn" onclick="penalty(${i})">${d}</button>`).join('')}</div></div>`;

// ---------- simulazione
function playSlot(sim) { if (!curSlot()) return; UI.simMode = !!sim; prepareSlot(); playNext(); }
function playTour(sim) { UI.simMode = !!sim; S.q = [tourCtx()]; playNext(); }
function simRun() {
  const m = UI.m;
  for (const e of m.ev) {
    m.min = e.m;
    if (e.t === 'gU') { m.gu++; m.feed.unshift(`${e.m}' ⚽ Gol ${esc(m.ctx.us.n)}.`); }
    else if (e.t === 'gT') { m.gt++; m.feed.unshift(`${e.m}' 😖 Gol ${esc(m.ctx.them.n)}.`); }
    else if (e.t === 'ch' && !m.red) {
      m.cur = e.c; m.curMin = e.m; const opts = e.c[1]; let best = 0, bv = -1e9;
      opts.forEach((o, i) => { const v = effStat(o[1]) - (m.sThem + o[2] + 3) + rnd(-3, 3); if (v > bv) { bv = v; best = i; } });
      m.opt = opts[best]; m.eff = effStat(m.opt[1]); m.diff = m.sThem + m.opt[2] + 3;
      const zw = clamp(15 + (m.eff - m.diff) * .8, 7, 34); const inZ = R() < clamp(zw / 100 * 2, .15, .65);
      const q = inZ ? rnd(.7, 1) : rnd(.05, .35); const base = 1 / (1 + Math.exp(-(m.eff - m.diff) / 6));
      const pf = inZ ? clamp(.8 + .15 * (q - .7) / .3 + (base - .5) * .1, .72, .97) : clamp(base * .5 + .03, .03, .45);
      resolveChance(R() < pf, q);
    }
  }
  if (m.ctx.ko && m.gu === m.gt) m.penWin = R() < clamp(.5 + (m.sUs - m.sThem) / 100, .1, .9);
  endMatch(); simFinish();
}
function simFinish() {
  const m = UI.m; const ctx = m.ctx, r = m.res;
  S.lmTmp = { opp: ctx.them.n }; applyMatch(ctx, r); if (m.red) S.p.rel.all = clamp(S.p.rel.all - 6, 0, 100);
  UI.m = null; save();
  const mine = m.feed.filter(x => /GOL DI|assist di|parata|Ottimo intervento|Espulso|Giallo|sprecata|errore|negato|nega/i.test(x)).reverse().slice(0, 6);
  openSheet(() => `<h3>⏩ ${esc(ctx.label)}</h3><div class="final">${scoreLine(ctx, r)}</div>
  <div class="voto" style="border-color:${vcol(r.v)}"><b style="color:${vcol(r.v)}">${r.v.toFixed(1).replace('.', ',')}</b><span>Voto</span></div>
